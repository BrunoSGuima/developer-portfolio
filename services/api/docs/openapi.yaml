openapi: 3.0.3
info:
  title: Developer Portfolio API
  version: 1.0.0
  description: |
    Read-only API of the developer portfolio (ADR-0011, ADR-0012). It is served same-origin with
    the React shell under /api (no CORS). Localised text always contains every supported
    language ("en", "pt-BR"); the client picks one. Every response body is either
    `{ "data": … }` or `{ "error": { "code", "message", "details" } }`.

    This document is the contract between the API and the shell: the Rails request specs
    validate every request and response against it (committee), and the shell checks its
    types and fixtures against it in Phase 3. Change it first when the API changes.
paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List the published projects
      description: Published projects only, ordered for display (position, then slug). No pagination.
      responses:
        "200":
          description: The published projects, in display order (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
              example:
                data:
                  - slug: developer-portfolio
                    name:
                      en: Developer Portfolio (this site)
                      pt-BR: Portfólio de Desenvolvedor (este site)
                    description:
                      en: An interactive portfolio built as a set of independent applications.
                      pt-BR: Um portfólio interativo construído como um conjunto de aplicações independentes.
                    status: in-progress
                    technologies: [react, typescript, vite, react-router]
                    links:
                      - label:
                          en: Source code
                          pt-BR: Código-fonte
                        url: https://github.com/BrunoSGuima/developer-portfolio
        "500":
          $ref: "#/components/responses/InternalError"
    # Write methods are listed only to document their 405 (the API is read-only).
    post: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    put: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    patch: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    delete: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
  /api/v1/projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getProject
      summary: Get a published project by its slug
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: >-
            No published project has this slug. Unknown, unpublished and badly formed slugs get
            the same response, so unpublished projects can't be discovered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: Project not found
                  details: {}
        "500":
          $ref: "#/components/responses/InternalError"
    # Write methods are listed only to document their 405 (the API is read-only).
    post: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    put: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    patch: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
    delete: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/MethodNotAllowed" } } }
  /api/v1/contact_messages:
    post:
      operationId: createContactMessage
      summary: Send a contact message
      description: |
        Stores a message for the site owner (ADR-0013). The response never contains an id or any
        submitted value. Abuse protection, per client IP: at most 20 requests and 5 accepted
        messages per hour (429 beyond that). `website` is a honeypot that people never see: when
        it is filled, the response is the same 202 but nothing is stored. The body must be a JSON
        object of at most 32 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageRequest"
      responses:
        "202":
          description: Accepted (also returned, with nothing stored, when the honeypot is filled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageAccepted"
              example:
                data:
                  status: received
        "400":
          description: The body isn't a JSON object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is larger than 32 KB (or has no Content-Length).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The body isn't application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid fields. `details` maps each invalid field to validation codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                error:
                  code: validation_failed
                  message: The message could not be sent
                  details:
                    email: [invalid]
                    message: [too_short]
        "429":
          description: Too many requests or messages from this client; try again later.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait (the length of the limit's window).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    get: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/PostOnly" } } }
    put: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/PostOnly" } } }
    patch: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/PostOnly" } } }
    delete: { summary: Not supported, responses: { "405": { $ref: "#/components/responses/PostOnly" } } }
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: >-
        The project's public identifier. Any string is accepted in the path; only lowercase
        hyphenated slugs can match a project, anything else is a 404.
      schema:
        type: string
  responses:
    InternalError:
      description: >-
        An unexpected error. The message is generic: exception details are never returned
        (production behaviour; development shows Rails' detailed error response instead).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: Internal Server Error
              details: {}
    MethodNotAllowed:
      description: >-
        The API is read-only. The Allow header lists the supported methods. The answer is the
        same whatever the request body (any body sent to these paths is ignored).
      headers:
        Allow:
          required: true
          schema:
            type: string
            enum: ["GET, HEAD"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: Method not allowed
              details: {}
    PostOnly:
      description: >-
        Messages can only be sent (POST); nothing can read them over HTTP. The answer is the
        same whatever the request body.
      headers:
        Allow:
          required: true
          schema:
            type: string
            enum: ["POST"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ContactMessageRequest:
      type: object
      required: [name, email, message, locale]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, inner whitespace collapsed; no control characters.
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Trimmed and lowercased; must look like an email address.
        message:
          type: string
          minLength: 10
          maxLength: 5000
          description: Trimmed; newlines and tabs allowed, no other control characters.
        locale:
          $ref: "#/components/schemas/Locale"
        website:
          type: string
          description: Honeypot. Leave empty; the form hides it from people.
    ContactMessageAccepted:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [received]
    Locale:
      description: The page language the message was sent from (the shell's locales).
      type: string
      enum: [en, pt-BR]
    ValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [validation_failed]
            message:
              type: string
            details:
              type: object
              additionalProperties: false
              properties:
                name: { $ref: "#/components/schemas/ValidationCodes" }
                email: { $ref: "#/components/schemas/ValidationCodes" }
                message: { $ref: "#/components/schemas/ValidationCodes" }
                locale: { $ref: "#/components/schemas/ValidationCodes" }
    ValidationCodes:
      type: array
      minItems: 1
      items:
        type: string
        enum: [blank, too_short, too_long, invalid, inclusion]
    ProjectList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Project"
    Project:
      type: object
      required: [slug, name, description, status, technologies, links]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 64
        name:
          $ref: "#/components/schemas/LocalizedText120"
        description:
          $ref: "#/components/schemas/LocalizedText1000"
        status:
          $ref: "#/components/schemas/Status"
        technologies:
          description: Technology ids in badge order (labels and colours belong to the client).
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        links:
          description: In display order.
          type: array
          items:
            $ref: "#/components/schemas/ProjectLink"
    ProjectLink:
      type: object
      required: [label, url]
      additionalProperties: false
      properties:
        label:
          $ref: "#/components/schemas/LocalizedText60"
        url:
          type: string
          pattern: "^https://"
          maxLength: 2048
    Status:
      description: Delivery status, shown as words (the shell's content/status.ts).
      type: string
      enum: [done, live, in-progress, planned]
    Technology:
      description: Technology ids (the shell's sections/technologies.ts).
      type: string
      enum: [react, typescript, vite, react-router, vue, rails, flutter, dart, rspec, bootstrap]
    LocalizedText120:
      type: object
      required: [en, pt-BR]
      additionalProperties: false
      properties:
        en: { type: string, minLength: 1, maxLength: 120 }
        pt-BR: { type: string, minLength: 1, maxLength: 120 }
    LocalizedText1000:
      type: object
      required: [en, pt-BR]
      additionalProperties: false
      properties:
        en: { type: string, minLength: 1, maxLength: 1000 }
        pt-BR: { type: string, minLength: 1, maxLength: 1000 }
    LocalizedText60:
      type: object
      required: [en, pt-BR]
      additionalProperties: false
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        pt-BR: { type: string, minLength: 1, maxLength: 60 }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - bad_request
                - not_found
                - method_not_allowed
                - payload_too_large
                - unsupported_media_type
                - validation_failed
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: object
