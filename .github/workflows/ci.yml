# Continuous integration (ADR-0010): every push to main and every pull request runs the same
# checks as a local `npm run …` (frontend) and `bin/ci` (Rails API). No deployment: hosting is
# postponed until the Rails API and PostgreSQL are integrated (docs/ROADMAP.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out code and uploads its own reports.
permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint, types, unit tests, content, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (the comment is the release they correspond to).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/openapi-types/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The isolated, lockfile-pinned generator (ADR-0014): npm ci from its own lockfile, no
      # install scripts.
      - name: Install the OpenAPI type generator
        run: npm run api:types:install

      - name: Generated API types are up to date
        run: npm run api:types:check

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: No unconfirmed content (placeholders)
        run: npm run content:check

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Full stack (Phase 3): Playwright starts the Rails API in its e2e environment
    # (services/api/bin/e2e-server, database portfolio_api_e2e) and the shell's preview, which
    # proxies /api to it. Same image and throwaway password as the api job (not a secret).
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U portfolio -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10 --health-start-period 10s
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: portfolio
      DATABASE_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ruby from services/api/.ruby-version and the API's gems (cached), for the e2e API server.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: services/api
          bundler-cache: true

      # The browser build is tied to the Playwright version: cache it under that version.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser only; the system libraries are installed on every run.
      - name: Install the system libraries (browser restored from cache)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Starts the e2e API and the shell's preview, then runs every spec (CI mode: two workers,
      # two retries, GitHub annotations).
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  api:
    name: Rails API (RuboCop, bundler-audit, Brakeman, RSpec)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    services:
      # Same image as infra/compose.yaml. The password below is NOT a secret: it only guards this
      # job's own throwaway container on the runner (destroyed with it). It is a literal because
      # service definitions can't read the job's env, and repository secrets aren't available to
      # pull requests from forks.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U portfolio -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10 --health-start-period 10s
    # The connection settings a developer keeps in services/api/.env (config/database.yml).
    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: portfolio
      DATABASE_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ruby from services/api/.ruby-version; gems installed from the frozen Gemfile.lock and
      # cached (key: OS, Ruby version, Gemfile.lock).
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: services/api
          bundler-cache: true

      # The same command as locally (config/ci.rb): setup (development and test databases),
      # RuboCop, bundler-audit, Brakeman and RSpec. Any failing step fails the job.
      - name: API checks (bin/ci)
        run: bin/ci
