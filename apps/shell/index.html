<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons: crops of the approved mascot art (scripts/build-favicon.mjs). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fcf5ed" />
    <!-- Social sharing preview (Open Graph, X): static, so link-preview crawlers, which don't run
         JavaScript, see it. One site-wide English card with absolute production URLs; the image
         is built by scripts/build-og-image.mjs (src/app/socialMetadata.test.ts checks both). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bruno Guimarães" />
    <meta property="og:title" content="Bruno Guimarães | Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="Explore my software engineering portfolio, projects, architecture, and approach to AI-assisted development."
    />
    <meta property="og:url" content="https://bruno-guimaraes.pages.dev/" />
    <meta property="og:image" content="https://bruno-guimaraes.pages.dev/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bruno Guimarães, Full Stack Software Engineer: his illustrated mascot in a suit, pointing upward in a sunny home office."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bruno Guimarães | Full Stack Software Engineer" />
    <meta
      name="twitter:description"
      content="Explore my software engineering portfolio, projects, architecture, and approach to AI-assisted development."
    />
    <meta name="twitter:image" content="https://bruno-guimaraes.pages.dev/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Bruno Guimarães, Full Stack Software Engineer: his illustrated mascot in a suit, pointing upward in a sunny home office."
    />
    <!-- The theme, before the first paint (no inline script: the Content Security Policy).
         ADR-0017; keep it before the stylesheets. -->
    <script src="/theme-init.js"></script>
    <!-- The description, canonical and language alternates are rendered per page and language by
         the app (app/Metadata.tsx); a static description here would shadow the localized one. -->
    <title>Bruno Guimarães — Full-Stack Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
